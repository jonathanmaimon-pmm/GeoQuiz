<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffd66b" />
  <title>Trivia Time</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main id="app">
    <!-- Topic-picker (front door) -->
    <section id="topics" class="screen active">
      <h1 class="title">Trivia Time <span aria-hidden="true">🎉</span></h1>
      <p class="subtitle">Choose a topic!</p>
      <div id="topic-grid" class="mode-grid">
        <button class="mode-card" data-topic="geography">
          <span class="mode-icon" aria-hidden="true">🌍</span>
          <span class="mode-label">Geography</span>
        </button>
        <button class="mode-card" data-topic="animals">
          <span class="mode-icon" aria-hidden="true">🐾</span>
          <span class="mode-label">Animals</span>
        </button>
      </div>
    </section>

    <!-- Per-topic mode-picker (populated by JS) -->
    <section id="home" class="screen">
      <header class="home-header">
        <button id="topics-btn" class="icon-btn" aria-label="Back to topics">←</button>
        <h1 id="home-title" class="title"></h1>
        <span class="header-spacer" aria-hidden="true"></span>
      </header>
      <p class="subtitle">Pick a game!</p>
      <div id="mode-grid" class="mode-grid"></div>
    </section>

    <!-- Quiz screen -->
    <section id="quiz" class="screen">
      <header class="quiz-header">
        <button id="home-btn" class="icon-btn" aria-label="Back home">🏠</button>
        <div class="progress">
          <span id="q-number">1</span> / <span id="q-total">10</span>
        </div>
        <div class="score" aria-label="Score">
          <span aria-hidden="true">⭐</span> <span id="score">0</span>
        </div>
      </header>

      <div class="question">
        <p id="question-text" class="question-text"></p>
        <div id="question-media" class="question-media"></div>
      </div>

      <div id="choices" class="choices"></div>

      <button id="mic-btn" class="mic-btn hidden" type="button" aria-label="Say the answer">
        <span class="mic-icon" aria-hidden="true">🎤</span>
        <span class="mic-label">Say it!</span>
      </button>

      <div id="feedback" class="feedback" aria-live="polite"></div>
      <button id="next-btn" class="next-btn hidden">Next →</button>
    </section>

    <!-- Results screen -->
    <section id="results" class="screen">
      <h2 id="result-title" class="title"></h2>
      <div id="result-stars" class="result-stars" aria-hidden="true"></div>
      <p id="result-score" class="subtitle"></p>
      <div class="result-actions">
        <button id="play-again" class="big-btn">Play Again</button>
        <button id="back-home" class="big-btn secondary">Home</button>
      </div>
    </section>
  </main>

  <script src="data.js"></script>
  <script src="animals.js"></script>
  <script src="app.js"></script>
</body>
</html>
